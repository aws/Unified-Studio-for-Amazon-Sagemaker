AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cross-Domain Data Product Sync for SageMaker Unified Studio (Marketplace account).
  Deploys the four sync Lambdas, scoped EventBridge rules with dead-letter queues,
  least-privilege IAM, and the Lake Formation credential-vending role used to read
  the Producer account's S3 data.

Parameters:
  SourceAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS Account ID of the Producer account.
  SourceDatabase:
    Type: String
    Description: Glue database name in the Producer account.
  SourceDomainId:
    Type: String
    Description: DataZone domain ID in the Producer account (dzd-xxxxxxxx).
  SourceProjectId:
    Type: String
    Default: ''
    Description: (Optional) DataZone project ID in the Producer account.
  TargetDatabase:
    Type: String
    Description: Glue database in this account (Marketplace project's Lakehouse DB).
  DomainId:
    Type: String
    Description: DataZone domain ID in this account (Marketplace).
  ProjectId:
    Type: String
    Description: DataZone project ID in this account (Marketplace).
  ProjectEnvironmentRoleArn:
    Type: String
    Description: ARN of the Marketplace project's environment role.
  SourceGlueRoleArn:
    Type: String
    Description: ARN of the Producer cross-account role for Glue/DQ reads (must trust this account).
  SourceDataZoneRoleArn:
    Type: String
    Description: ARN of the Producer cross-account role for DataZone reads (must trust this account).
  S3BucketArn:
    Type: String
    Description: ARN of the Producer's S3 bucket containing the table data.
  CodeS3Bucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda deployment artifacts.
  GlueTableSyncS3Key:
    Type: String
    Default: glue_table_sync.zip
    Description: S3 key for the glue-table-sync deployment package.
  CatalogSyncMirrorS3Key:
    Type: String
    Default: catalog_sync_mirror.zip
    Description: S3 key for the catalog-sync-mirror deployment package.
  DqResultsSyncS3Key:
    Type: String
    Default: dq_results_sync.zip
    Description: S3 key for the dq-results-sync deployment package.
  LineageSyncS3Key:
    Type: String
    Default: lineage_sync.zip
    Description: S3 key for the lineage-sync deployment package.

Resources:

  # --- Dead-letter queues for asynchronous Lambda/event failures ---
  GlueTableSyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cross-domain-glue-table-sync-dlq
      MessageRetentionPeriod: 1209600

  CatalogSyncMirrorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cross-domain-catalog-sync-mirror-dlq
      MessageRetentionPeriod: 1209600

  DqResultsSyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cross-domain-dq-results-sync-dlq
      MessageRetentionPeriod: 1209600

  LineageSyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cross-domain-lineage-sync-dlq
      MessageRetentionPeriod: 1209600

  # --- Allow EventBridge to deliver failed rule-target events to the DLQs ---
  # Required for the rule-target DeadLetterConfig to work: without this policy
  # EventBridge cannot write to the queues and dead-lettered events are lost.
  EventBridgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref GlueTableSyncDLQ
        - !Ref CatalogSyncMirrorDLQ
        - !Ref DqResultsSyncDLQ
        - !Ref LineageSyncDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSendToDLQs
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt GlueTableSyncDLQ.Arn
              - !GetAtt CatalogSyncMirrorDLQ.Arn
              - !GetAtt DqResultsSyncDLQ.Arn
              - !GetAtt LineageSyncDLQ.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'

  # --- IAM role for the Lambdas (least privilege) ---
  CatalogSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CatalogSyncLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AssumeProducerRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Ref SourceGlueRoleArn
                  - !Ref SourceDataZoneRoleArn
        - PolicyName: GlueTargetDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetDatabase
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${TargetDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${TargetDatabase}/*'
        - PolicyName: DataZoneMarketplaceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - datazone:Search
                  - datazone:GetAsset
                  - datazone:CreateAssetRevision
                  - datazone:CreateListingChangeSet
                  - datazone:GetFormType
                  - datazone:PostTimeSeriesDataPoints
                  - datazone:PostLineageEvent
                Resource:
                  - !Sub 'arn:${AWS::Partition}:datazone:${AWS::Region}:${AWS::AccountId}:domain/${DomainId}'
        - PolicyName: LakeFormationGrant
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GrantPermissions
                  - lakeformation:GetDataAccess
                Resource: '*'
        - PolicyName: LambdaObservability
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt GlueTableSyncDLQ.Arn
                  - !GetAtt CatalogSyncMirrorDLQ.Arn
                  - !GetAtt DqResultsSyncDLQ.Arn
                  - !GetAtt LineageSyncDLQ.Arn

  # --- Lake Formation grants so the Lambda role can write to the target DB ---
  # The target Glue catalog is typically Lake Formation-managed, so IAM glue:*
  # permissions alone are not sufficient; the role also needs LF permissions.
  LFGrantCreateTableOnTargetDatabase:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt CatalogSyncLambdaRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref TargetDatabase
      Permissions:
        - CREATE_TABLE
        - DESCRIBE
      PermissionsWithGrantOption: []

  LFGrantTablePermsOnTargetDatabase:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt CatalogSyncLambdaRole.Arn
      Resource:
        Table:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref TargetDatabase
          TableWildcard: {}
      Permissions:
        - DESCRIBE
        - SELECT
        - ALTER
      PermissionsWithGrantOption:
        - DESCRIBE
        - SELECT

  # --- Lambda 1: Glue Table Sync ---
  GlueTableSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: glue-table-sync
      Runtime: python3.12
      Handler: glue_table_sync.handler
      Role: !GetAtt CatalogSyncLambdaRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt GlueTableSyncDLQ.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref GlueTableSyncS3Key
      Environment:
        Variables:
          SOURCE_ACCOUNT_ID: !Ref SourceAccountId
          SOURCE_DATABASE: !Ref SourceDatabase
          TARGET_DATABASE: !Ref TargetDatabase
          SOURCE_ROLE_ARN: !Ref SourceGlueRoleArn
          PROJECT_ROLE_ARN: !Ref ProjectEnvironmentRoleArn

  # --- Lambda 2: Catalog Sync Mirror ---
  CatalogSyncMirrorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: catalog-sync-mirror
      Runtime: python3.12
      Handler: catalog_sync_mirror.handler
      Role: !GetAtt CatalogSyncLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt CatalogSyncMirrorDLQ.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CatalogSyncMirrorS3Key
      Environment:
        Variables:
          SOURCE_ACCOUNT_ID: !Ref SourceAccountId
          SOURCE_DATABASE: !Ref SourceDatabase
          TARGET_DATABASE: !Ref TargetDatabase
          SOURCE_ROLE_ARN: !Ref SourceGlueRoleArn
          SOURCE_DZ_ROLE_ARN: !Ref SourceDataZoneRoleArn
          SOURCE_DOMAIN_ID: !Ref SourceDomainId
          SOURCE_PROJECT_ID: !Ref SourceProjectId
          DOMAIN_ID: !Ref DomainId
          PROJECT_ID: !Ref ProjectId
          ACCOUNT_ID: !Ref AWS::AccountId

  # --- Lambda 3: DQ Results Sync (event-driven, native Glue DQ event) ---
  DqResultsSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dq-results-sync
      Runtime: python3.12
      Handler: dq_results_sync.handler
      Role: !GetAtt CatalogSyncLambdaRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt DqResultsSyncDLQ.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DqResultsSyncS3Key
      Environment:
        Variables:
          SOURCE_ACCOUNT_ID: !Ref SourceAccountId
          SOURCE_DATABASE: !Ref SourceDatabase
          SOURCE_ROLE_ARN: !Ref SourceGlueRoleArn
          DOMAIN_ID: !Ref DomainId
          PROJECT_ID: !Ref ProjectId
          ACCOUNT_ID: !Ref AWS::AccountId

  # --- Lambda 4: Lineage Sync (event-driven, Glue job completion) ---
  LineageSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lineage-sync
      Runtime: python3.12
      Handler: lineage_sync.handler
      Role: !GetAtt CatalogSyncLambdaRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LineageSyncDLQ.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref LineageSyncS3Key
      Environment:
        Variables:
          SOURCE_DOMAIN_ID: !Ref SourceDomainId
          SOURCE_DZ_ROLE_ARN: !Ref SourceDataZoneRoleArn
          DOMAIN_ID: !Ref DomainId

  # --- EventBridge Rule: Glue Table Sync (from Producer via CloudTrail) ---
  GlueSyncFromProducerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: glue-sync-from-producer
      Description: Triggers table sync when the Producer creates/updates Glue tables.
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - glue.amazonaws.com
          eventName:
            - CreateTable
            - UpdateTable
          requestParameters:
            databaseName:
              - !Ref SourceDatabase
        account:
          - !Ref SourceAccountId
      Targets:
        - Id: glue-table-sync
          Arn: !GetAtt GlueTableSyncFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt GlueTableSyncDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  GlueSyncLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GlueTableSyncFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GlueSyncFromProducerRule.Arn

  # --- EventBridge Rule: Asset Sync (from Producer publish) ---
  AssetSyncFromProducerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: asset-sync-from-producer
      Description: Triggers metadata sync when the Producer publishes or revises an asset.
      EventPattern:
        source:
          - aws.datazone
        detail-type:
          - Asset Added To Catalog
          - New Asset Version Available
          - Asset Schema Changed
        account:
          - !Ref SourceAccountId
        detail:
          metadata:
            domain:
              - !Ref SourceDomainId
      Targets:
        - Id: catalog-sync-mirror
          Arn: !GetAtt CatalogSyncMirrorFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt CatalogSyncMirrorDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  AssetSyncLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CatalogSyncMirrorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AssetSyncFromProducerRule.Arn

  # --- EventBridge Rule: Data Source Run Succeeded (Marketplace domain) ---
  DataSourceRunRule:
    Type: AWS::Events::Rule
    Properties:
      Name: datasource-run-triggers-asset-sync
      Description: Triggers metadata overlay after the Marketplace data source discovers tables.
      EventPattern:
        source:
          - aws.datazone
        detail-type:
          - Data Source Run Succeeded
        account:
          - !Ref AWS::AccountId
        detail:
          metadata:
            domain:
              - !Ref DomainId
      Targets:
        - Id: catalog-sync-mirror
          Arn: !GetAtt CatalogSyncMirrorFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt CatalogSyncMirrorDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  DataSourceRunLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CatalogSyncMirrorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DataSourceRunRule.Arn

  # --- EventBridge Rule: DQ Results Sync (native Glue DQ event from Producer) ---
  DqSyncFromProducerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dq-sync-from-producer
      Description: Triggers DQ sync when the Producer completes a Glue Data Quality evaluation.
      EventPattern:
        source:
          - aws.glue-dataquality
        detail-type:
          - Data Quality Evaluation Results Available
        account:
          - !Ref SourceAccountId
      Targets:
        - Id: dq-results-sync
          Arn: !GetAtt DqResultsSyncFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt DqResultsSyncDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  DqSyncLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DqResultsSyncFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DqSyncFromProducerRule.Arn

  # --- EventBridge Rule: Lineage Sync (Glue job completion from Producer) ---
  LineageSyncFromProducerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: lineage-sync-from-producer
      Description: Triggers lineage sync when a Producer Glue job completes successfully.
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Job State Change
        detail:
          state:
            - SUCCEEDED
        account:
          - !Ref SourceAccountId
      Targets:
        - Id: lineage-sync
          Arn: !GetAtt LineageSyncFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt LineageSyncDLQ.Arn
          RetryPolicy:
            MaximumRetryAttempts: 4
            MaximumEventAgeInSeconds: 3600

  LineageSyncLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LineageSyncFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LineageSyncFromProducerRule.Arn

  # --- Lake Formation credential-vending role for cross-account S3 reads ---
  MirrorCatalogLFRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MirrorCatalogLFRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lakeformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Ref S3BucketArn
                  - !Sub '${S3BucketArn}/*'

  # After deployment, register the Producer's S3 location in Lake Formation
  # with MirrorCatalogLFRole. This must be done via CLI/API:
  #   aws lakeformation register-resource \
  #     --resource-arn <S3_PATH_ARN> \
  #     --role-arn <MirrorCatalogLFRole_ARN> \
  #     --use-service-linked-role false

  # --- Allow the Producer account to forward events to this default bus ---
  EventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      StatementId: AllowProducerAccountEvents
      Statement:
        Effect: Allow
        Principal:
          AWS: !Sub 'arn:${AWS::Partition}:iam::${SourceAccountId}:root'
        Action: events:PutEvents
        Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'

Outputs:
  GlueTableSyncFunctionArn:
    Description: ARN of the Glue Table Sync Lambda.
    Value: !GetAtt GlueTableSyncFunction.Arn
  CatalogSyncMirrorFunctionArn:
    Description: ARN of the Catalog Sync Mirror Lambda.
    Value: !GetAtt CatalogSyncMirrorFunction.Arn
  CatalogSyncLambdaRoleArn:
    Description: ARN of the Lambda execution role (add as Contributor to both SMUS projects).
    Value: !GetAtt CatalogSyncLambdaRole.Arn
  MirrorCatalogLFRoleArn:
    Description: ARN of the Lake Formation credential-vending role.
    Value: !GetAtt MirrorCatalogLFRole.Arn
  GlueTableSyncDLQUrl:
    Description: URL of the glue-table-sync dead-letter queue.
    Value: !Ref GlueTableSyncDLQ
  CatalogSyncMirrorDLQUrl:
    Description: URL of the catalog-sync-mirror dead-letter queue.
    Value: !Ref CatalogSyncMirrorDLQ
  DqResultsSyncFunctionArn:
    Description: ARN of the DQ Results Sync Lambda (event-driven DQ path).
    Value: !GetAtt DqResultsSyncFunction.Arn
  DqResultsSyncDLQUrl:
    Description: URL of the dq-results-sync dead-letter queue.
    Value: !Ref DqResultsSyncDLQ
  LineageSyncFunctionArn:
    Description: ARN of the Lineage Sync Lambda (event-driven lineage path).
    Value: !GetAtt LineageSyncFunction.Arn
  LineageSyncDLQUrl:
    Description: URL of the lineage-sync dead-letter queue.
    Value: !Ref LineageSyncDLQ
